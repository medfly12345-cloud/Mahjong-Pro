<!DOCTYPE html>
<html lang="en" dir="ltr" id="app-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#062c1e">
    <title>Mahjong Pro: Ultimate Edition</title>

    <!-- Official Poki SDK -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100vh; height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            font-family: 'Segoe UI', system-ui, -apple-system, Tahoma, sans-serif;
            color: white;
            background: #03170f;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: ltr;
        }

        /* --- Mobile & Poki Responsive App Shell --- */
        #app-shell {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 860px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: 
                radial-gradient(circle at 50% 35%, rgba(16, 185, 129, 0.22), transparent 65%),
                radial-gradient(circle at center, #0d522c 0%, #073522 65%, #042216 100%);
            box-shadow: 0 0 60px rgba(0,0,0,0.95);
            overflow: hidden;
        }

        @media (min-width: 860px) {
            #app-shell {
                border-left: 2px solid rgba(52, 211, 153, 0.2);
                border-right: 2px solid rgba(52, 211, 153, 0.2);
            }
        }

        #app-shell::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 22px 22px;
            pointer-events: none;
        }

        /* --- Top HUD --- */
        header {
            flex: 0 0 auto;
            width: 100%;
            padding: calc(env(safe-area-inset-top, 4px) + 6px) 16px 4px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: linear-gradient(180deg, rgba(2, 28, 18, 0.9) 0%, rgba(2, 28, 18, 0) 100%);
            z-index: 100;
        }

        .hud-pill {
            background: rgba(4, 47, 46, 0.85);
            border: 1.5px solid rgba(52, 211, 153, 0.45);
            border-radius: 16px;
            padding: 5px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 96px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 4px 8px rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
        }

        .stat-label {
            font-size: 11px;
            color: #86efac;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 19px;
            color: #ffffff;
            font-weight: 900;
            line-height: 1.1;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #022c22;
            border-radius: 4px;
            margin-top: 4px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #facc15, #f59e0b);
            border-radius: 4px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .header-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .score-pill {
            background: linear-gradient(180deg, #064e3b, #022c22);
            border: 2px solid #fbbf24;
            border-radius: 22px;
            padding: 3px 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .score-value {
            font-size: 24px;
            color: #fef08a;
            font-weight: 900;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
            transition: transform 0.15s ease;
        }
        .score-bump { transform: scale(1.25); color: #fde047; }

        .best-score-sub {
            font-size: 11px;
            color: #a7f3d0;
            margin-top: 2px;
            font-weight: bold;
            opacity: 0.9;
        }

        .combo-badge {
            font-size: 11px;
            color: #fff;
            background: linear-gradient(90deg, #f97316, #dc2626);
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 900;
            margin-top: 2px;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.6);
            opacity: 0;
            transform: scale(0.7);
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
        }
        .combo-badge.active { opacity: 1; transform: scale(1); }
        .val-gold { color: #fbbf24; font-size: 28px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* --- Game Board Area (Fixed for PC & Mobile so it never pushes controls off-screen) --- */
        #board-wrapper {
            flex: 1 1 0%;
            min-height: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        #game-board {
            position: relative;
            width: 530px;
            height: 500px;
            transform-origin: center center;
            transition: transform 0.25s ease;
            flex-shrink: 0;
        }

        /* --- 3D Mahjong Tile Styling (Enlarged) --- */
        .tile {
            position: absolute;
            background-color: #fcfaf2;
            border-radius: 9px;
            cursor: pointer;
            transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s, box-shadow 0.16s, opacity 0.25s;
            border: 1px solid #cbd5e1;
            box-shadow:
                inset 1.5px 1.5px 0px #ffffff,
                inset -1px -1px 2px rgba(148, 163, 184, 0.5),
                -4px 5px 0px #1e3a8a,
                -6px 9px 12px rgba(0,0,0,0.65);
            background-size: 94% 94%;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes deal-drop {
            0% { opacity: 0; transform: translateY(-60px) scale(0.75); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .tile.dealing {
            animation: deal-drop 0.32s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }

        .tile.selected {
            transform: translateY(-10px) translateX(3px) scale(1.06);
            box-shadow:
                inset 0 0 8px rgba(251, 191, 36, 0.4),
                -4px 6px 0px #b45309,
                0 0 20px 6px rgba(251, 191, 36, 0.9);
            border-color: #fbbf24;
            z-index: 999 !important;
            background-color: #fffbeb;
        }

        .tile.blocked {
            cursor: not-allowed;
            filter: brightness(0.9) contrast(0.95);
        }

        @keyframes tile-shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-5px) rotate(-2deg); }
            40% { transform: translateX(5px) rotate(2deg); }
            60% { transform: translateX(-4px) rotate(-1deg); }
            80% { transform: translateX(4px) rotate(1deg); }
        }
        .tile.shake {
            animation: tile-shake 0.28s ease-in-out !important;
            filter: brightness(0.55) sepia(0.4) hue-rotate(-30deg) !important;
        }

        /* --- Mystery (Face-Down) Tile --- */
        .tile.facedown {
            background-image: none !important;
            background: linear-gradient(135deg, #0ea5e9, #1d4ed8) !important;
            border: 1px solid #93c5fd !important;
            box-shadow: -4px 5px 0px #0f172a, -6px 8px 10px rgba(0,0,0,0.8) !important;
        }
        .tile.facedown::after {
            content: "❖";
            color: rgba(255, 255, 255, 0.45);
            font-size: 24px;
            pointer-events: none;
        }

        @keyframes pulse-hint-extreme {
            0% { transform: scale(1); box-shadow: -4px 5px 0px #1e3a8a; }
            50% { transform: scale(1.15) translateY(-12px); box-shadow: 0 15px 30px 10px rgba(251, 191, 36, 0.95), 0 0 15px #f59e0b inset; background-color: #fffbeb; border-color: #fbbf24; }
            100% { transform: scale(1); box-shadow: -4px 5px 0px #1e3a8a; }
        }
        .tile.hinted { animation: pulse-hint-extreme 1.2s infinite ease-in-out !important; z-index: 1000 !important; }

        /* --- Floating Score Popup --- */
        .floating-score {
            position: absolute;
            pointer-events: none;
            z-index: 1600;
            font-weight: 900;
            font-size: 21px;
            color: #fef08a;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9), 0 0 10px #f59e0b;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            animation: float-up 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes float-up {
            0% { opacity: 0; transform: translate(-50%, -20%) scale(0.6); }
            25% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
            100% { opacity: 0; transform: translate(-50%, -140%) scale(0.95); }
        }

        /* --- Bottom App Dock (Always Visible on PC & Mobile) --- */
        .controls {
            flex: 0 0 auto;
            width: calc(100% - 28px);
            max-width: 420px;
            margin: 2px auto calc(env(safe-area-inset-bottom, 6px) + 8px) auto;
            padding: 7px 18px;
            background: rgba(4, 47, 46, 0.88);
            border: 1.5px solid rgba(52, 211, 153, 0.45);
            border-radius: 28px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 105;
            box-shadow: 0 8px 22px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
        }

        .action-btn-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .action-btn.circular {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 20%, #a3e635, #4d7c0f);
            border: 3px solid #facc15;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 0;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.35), inset 0 3px 0 rgba(255,255,255,0.45), 0 5px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s, box-shadow 0.1s, filter 0.2s;
        }
        .action-btn.circular:active {
            transform: translateY(4px) scale(0.95);
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Badge for the 2 Help Buttons Below */
        .btn-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 22px;
            height: 22px;
            padding: 0 5px;
            background: linear-gradient(180deg, #22c55e, #15803d);
            border: 2px solid white;
            border-radius: 12px;
            color: white;
            font-size: 12px;
            font-weight: 900;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            pointer-events: none;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-badge.ad-mode {
            background: linear-gradient(180deg, #f59e0b, #d97706);
        }

        .count-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 22px;
            height: 22px;
            padding: 0 5px;
            background: #0ea5e9;
            border: 2px solid white;
            border-radius: 12px;
            color: white;
            font-size: 12px;
            font-weight: 900;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        /* --- Particles & Confetti --- */
        .particle {
            position: absolute; width: 10px; height: 10px; border-radius: 50%;
            pointer-events: none; z-index: 1500;
            animation: explode 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            box-shadow: 0 0 8px currentColor;
        }
        @keyframes explode {
            0% { transform: scale(1) translate(0, 0); opacity: 1; }
            100% { transform: scale(0) translate(var(--tx), var(--ty)); opacity: 0; }
        }

        .confetti {
            position: absolute;
            width: 9px;
            height: 16px;
            pointer-events: none;
            z-index: 2500;
            animation: confetti-fall 2.4s ease-in forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* --- Modal Overlay Screens --- */
        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 18, 12, 0.85);
            backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 2000;
            animation: fade-in 0.22s ease;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .hidden { display: none !important; }

        .menu-box {
            background: linear-gradient(160deg, #0f766e, #042f2e);
            padding: 28px 24px;
            border-radius: 24px;
            border: 2.5px solid #34d399;
            text-align: center;
            width: 88%;
            max-width: 350px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.85), inset 0 2px 2px rgba(255,255,255,0.2);
            max-height: 88vh;
            display: flex;
            flex-direction: column;
        }

        .app-logo-badge {
            width: 82px;
            height: 102px;
            margin: 0 auto 14px auto;
            background: #fcfaf2;
            border-radius: 14px;
            border: 2px solid #cbd5e1;
            box-shadow: -6px 8px 0px #1e3a8a, 0 12px 25px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 46px;
            color: #dc2626;
            font-weight: 900;
            animation: float-logo 2.5s ease-in-out infinite;
        }
        @keyframes float-logo {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }

        .stars-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 8px 0 12px 0;
            font-size: 42px;
        }
        .star-item {
            color: #fde047;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
            transform: scale(0);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .star-item.show { transform: scale(1); }

        .reward-bonus-pill {
            background: rgba(16, 185, 129, 0.25);
            border: 1.5px solid #34d399;
            color: #a7f3d0;
            border-radius: 14px;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 16px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
        }

        .btn-large {
            background: linear-gradient(180deg, #fde047 0%, #f59e0b 55%, #d97706 100%);
            border: 2px solid #fef08a;
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 900;
            color: #451a03;
            box-shadow: 0 5px 0 #92400e, 0 8px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            margin-bottom: 10px;
            font-family: inherit;
            flex-shrink: 0;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-large:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #92400e;
        }
        .btn-large.cancel {
            background: linear-gradient(180deg, #9ca3af, #4b5563);
            border-color: #d1d5db;
            box-shadow: 0 4px 0 #374151;
            color: white;
            margin-top: 8px;
        }

        .settings-toggles {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }
        .btn-toggle-opt {
            flex: 1;
            background: linear-gradient(180deg, #3b82f6, #1d4ed8);
            border: 1.5px solid #93c5fd;
            box-shadow: 0 4px 0 #1e3a8a;
            color: white;
            font-size: 14px;
            padding: 10px 6px;
            margin-bottom: 0;
            border-radius: 12px;
        }
        .btn-toggle-opt.muted {
            background: linear-gradient(180deg, #ef4444, #b91c1c);
            border-color: #fca5a5;
            box-shadow: 0 4px 0 #7f1d1d;
        }

        .lang-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            overflow-y: auto;
            padding-bottom: 5px;
            margin-bottom: 5px;
            scrollbar-width: thin;
            scrollbar-color: #34d399 transparent;
        }
        .lang-btn {
            background: linear-gradient(180deg, #10b981, #059669);
            border: 1px solid #6ee7b7;
            color: white;
            box-shadow: 0 3px 0 #047857;
            padding: 10px 5px;
            font-size: 15px;
            margin-bottom: 0;
            border-radius: 12px;
        }

        .ad-loader {
            width: 50px; height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #toast {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(2, 24, 16, 0.94);
            color: #86efac;
            padding: 10px 22px;
            border: 1.5px solid #34d399;
            border-radius: 24px;
            font-size: 15px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 3000;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            white-space: nowrap;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="app-shell">
        <!-- Start Screen -->
        <div id="start-screen" class="overlay-screen">
            <div class="menu-box" style="justify-content: center;">
                <div class="app-logo-badge">🀄</div>
                <h2 id="ui-title" style="color: #fbbf24; margin: 0 0 8px 0; font-size: 30px; text-shadow: 0 3px 6px rgba(0,0,0,0.6);">Mahjong Pro</h2>
                <p id="ui-saved-lvl" style="color: #a7f3d0; margin: 0 0 22px 0; font-size: 15px; font-weight: bold;">Level 1</p>
                <button class="btn-large" id="btn-start">Play Now</button>
            </div>
        </div>

        <!-- Level Complete / Victory Screen -->
        <div id="end-screen" class="overlay-screen hidden">
            <div class="menu-box" style="justify-content: center;">
                <h2 id="ui-end-title" style="color: #fbbf24; margin: 0; font-size: 28px;">Great Job!</h2>
                <div class="stars-row">
                    <span class="star-item" id="star-1">⭐</span>
                    <span class="star-item" id="star-2">⭐</span>
                    <span class="star-item" id="star-3">⭐</span>
                </div>
                <p style="font-size: 19px; margin: 4px 0 12px 0;"><span id="ui-score-text">Score: </span> <strong class="val-gold" id="end-score">0</strong></p>
                <div class="reward-bonus-pill" id="ui-level-bonus">🎁 Level Bonus: +2 Shuffle & +2 Hint!</div>
                <button class="btn-large" id="btn-next-level">Next Level</button>
            </div>
        </div>

        <!-- Rewarded Ad Prompt Screen -->
        <div id="reward-prompt-screen" class="overlay-screen hidden">
            <div class="menu-box" style="justify-content: center;">
                <h2 id="ui-rew-title" style="color: #fbbf24; margin-top: 0;">Extra Help 🎥</h2>
                <p id="reward-text" style="font-size: 17px; margin-bottom: 20px; line-height: 1.4;">Watch a short ad to get +2 helps.</p>
                <button class="btn-large" id="btn-watch-ad">Watch Ad ▶</button>
                <button class="btn-large cancel" id="btn-cancel-ad">Cancel</button>
            </div>
        </div>

        <!-- Local Ad Simulator Fallback -->
        <div id="ad-simulator" class="overlay-screen hidden">
            <h2 id="ui-ad-show" style="color: white;">Showing Ad...</h2>
            <div class="ad-loader"></div>
            <p id="ui-ad-wait" style="color: #9ca3af;">Please wait...</p>
        </div>

        <!-- Settings Screen -->
        <div id="settings-screen" class="overlay-screen hidden">
            <div class="menu-box">
                <h2 id="ui-set-title" style="color: #fbbf24; margin-top: 0; margin-bottom: 12px; flex-shrink: 0;">Settings</h2>
                <div class="settings-toggles">
                    <button class="btn-large btn-toggle-opt" id="btn-toggle-sound">🔊 Sound: ON</button>
                    <button class="btn-large btn-toggle-opt" id="btn-toggle-vib">📳 Haptics: ON</button>
                </div>
                <p id="ui-set-desc" style="margin-bottom: 10px; margin-top: 0; font-size: 14px; color: #a7f3d0; flex-shrink: 0;">Choose Language:</p>
                
                <div class="lang-grid">
                    <button class="btn-large lang-btn" data-lang="en">English</button>
                    <button class="btn-large lang-btn" data-lang="fr">Français</button>
                    <button class="btn-large lang-btn" data-lang="es">Español</button>
                    <button class="btn-large lang-btn" data-lang="de">Deutsch</button>
                    <button class="btn-large lang-btn" data-lang="it">Italiano</button>
                    <button class="btn-large lang-btn" data-lang="pt">Português</button>
                    <button class="btn-large lang-btn" data-lang="ru">Русский</button>
                    <button class="btn-large lang-btn" data-lang="ja">日本語</button>

        </div>

        <!-- Top HUD -->
        <header id="top-hud">

        <!-- Game Board Wrapper -->
        <div id="board-wrapper">
            <div id="game-board"></div>
            <div id="toast">Auto-reshuffling!</div>

        <!-- Bottom App Controls Dock (2 Help Buttons with 2 Charges + Undo + Settings) -->
        <div class="controls" id="bottom-controls">
            <div class="action-btn-wrapper" id="shuffle-wrapper">
                <button class="action-btn circular" id="btn-shuffle">
                    <img id="icon-shuffle" alt="Shuffle" style="width: 26px; height: 26px; object-fit: contain; pointer-events: none;">
                </button>
                <div class="btn-badge" id="badge-shuffle">2</div>

                <button class="action-btn circular" id="btn-hint">
                    <img id="icon-hint" alt="Hint" style="width: 26px; height: 26px; object-fit: contain; pointer-events: none;">
                </button>
                <div class="btn-badge" id="badge-hint">2</div>
            </div>

            <div class="action-btn-wrapper">
                <button class="action-btn circular" id="btn-undo-move">
                    <img id="icon-undo" alt="Undo" style="width: 26px; height: 26px; object-fit: contain; pointer-events: none;">

    </div>

    <script>
        // =========================================================================
        // Poki QA Protection: Prevent unwanted page scrolling via keys or wheel
        // =========================================================================
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'PageUp', 'PageDown'].includes(e.key)) {
                e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener('wheel', (e) => {
            if (e.ctrlKey || !e.target.closest('.lang-grid')) {
                e.preventDefault();
            }
        }, { passive: false });

        // =========================================================================
        // Mobile Haptics & LocalStorage Persistence (Default Locked to English)
        // =========================================================================
        let currentLang = 'en';
        let currentLevelIndex = 0;
        let isProcessing = false;
        
        // 2 Free Helps on the 2 bottom buttons (Level 1 -> 2, Level 3 -> 2, Level 5 -> 2...)
        const HELPS_AMOUNT = 2;
        let shuffleHelps = HELPS_AMOUNT;
        let hintHelps = HELPS_AMOUNT;
        let pendingRewardType = null;

        let comboCount = 0;
        let lastMatchTime = 0;
        let comboTimeout = null;

        const AppState = {
            vibrateEnabled: true,
            bestScore: 0,

            load() {
                try {
                    localStorage.removeItem('mahjong_lang');
                    localStorage.removeItem('mahjong_en_shuffle_helps');
                    localStorage.removeItem('mahjong_en_hint_helps');

                    const savedLvl = localStorage.getItem('mahjong_v3_lvl');
                    const savedBest = localStorage.getItem('mahjong_v3_best');
                    const savedLang = localStorage.getItem('mahjong_v3_lang');
                    const savedSound = localStorage.getItem('mahjong_v3_sound');
                    const savedVib = localStorage.getItem('mahjong_v3_vib');
                    const savedShuffleHelps = localStorage.getItem('mahjong_v3_shuffle_helps');
                    const savedHintHelps = localStorage.getItem('mahjong_v3_hint_helps');

                    if (savedLvl !== null) currentLevelIndex = parseInt(savedLvl, 10) || 0;
                    if (savedBest !== null) this.bestScore = parseInt(savedBest, 10) || 0;
                    if (savedLang && i18n[savedLang]) currentLang = savedLang;
                    if (savedSound !== null) SoundFX.enabled = savedSound === 'true';
                    if (savedVib !== null) this.vibrateEnabled = savedVib === 'true';
                    if (savedShuffleHelps !== null) shuffleHelps = parseInt(savedShuffleHelps, 10);
                    if (savedHintHelps !== null) hintHelps = parseInt(savedHintHelps, 10);
                } catch (e) {}
            },

            save() {
                try {
                    localStorage.setItem('mahjong_v3_lvl', currentLevelIndex);
                    localStorage.setItem('mahjong_v3_best', this.bestScore);
                    localStorage.setItem('mahjong_v3_lang', currentLang);
                    localStorage.setItem('mahjong_v3_sound', SoundFX.enabled);
                    localStorage.setItem('mahjong_v3_vib', this.vibrateEnabled);
                    localStorage.setItem('mahjong_v3_shuffle_helps', shuffleHelps);
                    localStorage.setItem('mahjong_v3_hint_helps', hintHelps);
                } catch (e) {}
            },

            haptic(pattern) {
                if (this.vibrateEnabled && navigator.vibrate) {
                    try { navigator.vibrate(pattern); } catch (e) {}
                }
            }
        };

        // =========================================================================
        // Embedded SVG Mahjong Tile Art Generator (25 Authentic Tiles + 4 Dock Icons)
        // =========================================================================
        function createMahjongResources() {
            const toDataURI = (svgContent) =>
                `data:image/svg+xml;charset=utf-8,${encodeURIComponent(
                    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 120">${svgContent}</svg>`
                )}`;

            const drawCircle = (cx, cy, r, color) => `
                <circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" stroke="#0f172a" stroke-width="1.2"/>
                <circle cx="${cx}" cy="${cy}" r="${r * 0.62}" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-dasharray="2.5,2"/>
                <circle cx="${cx}" cy="${cy}" r="${r * 0.28}" fill="#ffffff"/>
            `;

            const drawStick = (x, y, h, color) => `
                <g>
                    <rect x="${x - 4}" y="${y}" width="8" height="${h}" rx="4" fill="${color}" stroke="#0f172a" stroke-width="1"/>
                    <line x1="${x - 4}" y1="${y + h / 2}" x2="${x + 4}" y2="${y + h / 2}" stroke="#ffffff" stroke-width="2"/>
                    <line x1="${x - 1.5}" y1="${y + 3}" x2="${x - 1.5}" y2="${y + h - 3}" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" stroke-linecap="round"/>
                </g>
            `;

            const R = "#dc2626";
            const G = "#15803d";
            const B = "#1d4ed8";

            const tiles = [
                // 1-9 Dots (Pinzu)
                toDataURI(`
                    <circle cx="44" cy="60" r="31" fill="${R}" stroke="#0f172a" stroke-width="2"/>
                    <circle cx="44" cy="60" r="23" fill="${G}" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,2.5"/>
                    <circle cx="44" cy="60" r="14" fill="${B}" stroke="#ffffff" stroke-width="1.5"/>
                    <circle cx="44" cy="60" r="6" fill="#facc15"/>
                `),
                toDataURI(drawCircle(44, 34, 18, G) + drawCircle(44, 86, 18, B)),
                toDataURI(drawCircle(24, 28, 14, B) + drawCircle(44, 60, 14, R) + drawCircle(64, 92, 14, G)),
                toDataURI(drawCircle(26, 34, 15, B) + drawCircle(62, 34, 15, G) + drawCircle(26, 86, 15, G) + drawCircle(62, 86, 15, B)),
                toDataURI(drawCircle(24, 30, 13, B) + drawCircle(64, 30, 13, G) + drawCircle(44, 60, 13, R) + drawCircle(24, 90, 13, G) + drawCircle(64, 90, 13, B)),
                toDataURI(drawCircle(27, 28, 12.5, G) + drawCircle(61, 28, 12.5, G) + drawCircle(27, 64, 12.5, R) + drawCircle(61, 64, 12.5, R) + drawCircle(27, 94, 12.5, R) + drawCircle(61, 94, 12.5, R)),
                toDataURI(drawCircle(20, 22, 10.5, G) + drawCircle(44, 32, 10.5, G) + drawCircle(68, 42, 10.5, G) + drawCircle(27, 70, 11.5, R) + drawCircle(61, 70, 11.5, R) + drawCircle(27, 96, 11.5, R) + drawCircle(61, 96, 11.5, R)),
                toDataURI([24, 48, 72, 96].map(y => drawCircle(27, y, 10.5, B) + drawCircle(61, y, 10.5, B)).join('')),
                toDataURI([22, 44, 66].map(x => drawCircle(x, 28, 10, G) + drawCircle(x, 60, 10, R) + drawCircle(x, 92, 10, B)).join('')),

                // 10-18 Bamboo (Souzu)
                toDataURI(`
                    <circle cx="44" cy="62" r="32" fill="#ecfdf5" stroke="${G}" stroke-width="2"/>
                    <path d="M44 25 C58 25, 68 42, 58 64 C66 76, 56 96, 44 96 C32 96, 22 76, 30 64 C20 42, 30 25, 44 25 Z" fill="${G}"/>
                    <ellipse cx="44" cy="64" rx="14" ry="18" fill="${R}"/>
                    <circle cx="44" cy="40" r="9" fill="${B}"/>
                    <circle cx="41" cy="38" r="2.5" fill="#ffffff"/>
                    <polygon points="48,37 58,40 48,43" fill="#facc15"/>
                    <path d="M34 86 L44 74 L54 86 L44 98 Z" fill="#facc15"/>
                `),
                toDataURI(drawStick(44, 18, 38, B) + drawStick(44, 64, 38, G)),
                toDataURI(drawStick(44, 18, 38, B) + drawStick(27, 64, 38, G) + drawStick(61, 64, 38, G)),
                toDataURI(drawStick(27, 18, 38, B) + drawStick(61, 18, 38, G) + drawStick(27, 64, 38, G) + drawStick(61, 64, 38, B)),
                toDataURI(drawStick(22, 18, 38, G) + drawStick(66, 18, 38, B) + drawStick(44, 41, 38, R) + drawStick(22, 64, 38, B) + drawStick(66, 64, 38, G)),
                toDataURI([24, 44, 64].map(x => drawStick(x, 18, 38, G) + drawStick(x, 64, 38, B)).join('')),
                toDataURI(drawStick(44, 12, 28, R) + [24, 44, 64].map(x => drawStick(x, 44, 30, G) + drawStick(x, 78, 30, B)).join('')),
                toDataURI([20, 36, 52, 68].map(x => drawStick(x, 18, 38, G) + drawStick(x, 64, 38, B)).join('')),
                toDataURI([22, 44, 66].map((x, i) => {
                    const col = i === 1 ? R : (i === 0 ? G : B);
                    return drawStick(x, 12, 29, col) + drawStick(x, 45, 29, col) + drawStick(x, 78, 29, col);
                }).join('')),

                // 19-25 Characters, Dragons, Flower
                toDataURI(`
                    <text x="44" y="48" font-size="36" font-weight="900" font-family="serif" text-anchor="middle" fill="#1e293b">一</text>
                    <text x="44" y="96" font-size="42" font-weight="900" font-family="serif" text-anchor="middle" fill="${R}">萬</text>
                `),
                toDataURI(`
                    <text x="44" y="48" font-size="36" font-weight="900" font-family="serif" text-anchor="middle" fill="#1e293b">五</text>
                    <text x="44" y="96" font-size="42" font-weight="900" font-family="serif" text-anchor="middle" fill="${R}">萬</text>
                `),
                toDataURI(`
                    <text x="44" y="48" font-size="36" font-weight="900" font-family="serif" text-anchor="middle" fill="#1e293b">九</text>
                    <text x="44" y="96" font-size="42" font-weight="900" font-family="serif" text-anchor="middle" fill="${R}">萬</text>
                `),
                toDataURI(`
                    <rect x="12" y="14" width="64" height="92" rx="6" fill="none" stroke="${R}" stroke-width="2.5"/>
                    <text x="44" y="80" font-size="58" font-weight="900" font-family="serif" text-anchor="middle" fill="${R}">中</text>
                `),
                toDataURI(`
                    <rect x="12" y="14" width="64" height="92" rx="6" fill="none" stroke="${G}" stroke-width="2.5"/>
                    <text x="44" y="80" font-size="54" font-weight="900" font-family="serif" text-anchor="middle" fill="${G}">發</text>
                `),
                toDataURI(`
                    <rect x="14" y="16" width="60" height="88" rx="6" fill="none" stroke="${B}" stroke-width="4.5"/>
                    <rect x="21" y="23" width="46" height="74" rx="3" fill="none" stroke="${B}" stroke-width="2" stroke-dasharray="6,3"/>
                    <circle cx="44" cy="60" r="8" fill="none" stroke="${B}" stroke-width="2.5"/>
                `),
                toDataURI(`
                    <circle cx="44" cy="60" r="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
                    <g fill="${R}" stroke="#ffffff" stroke-width="1">
                        <circle cx="44" cy="36" r="11"/><circle cx="44" cy="84" r="11"/>
                        <circle cx="20" cy="60" r="11"/><circle cx="68" cy="60" r="11"/>
                        <circle cx="27" cy="43" r="11"/><circle cx="61" cy="43" r="11"/>
                        <circle cx="27" cy="77" r="11"/><circle cx="61" cy="77" r="11"/>
                    </g>
                    <circle cx="44" cy="60" r="12" fill="#facc15" stroke="#b45309" stroke-width="2"/>
                    <text x="44" y="65" font-size="14" font-weight="bold" font-family="serif" text-anchor="middle" fill="#7c2d12">花</text>
                `)
            ];

            const icons = {
                shuffle: `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>`)}`,
                hint: `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>`)}`,
                undo: `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>`)}`,
                settings: `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`)}`
            };

            return { tiles, icons };
        }

        const mahjongResources = createMahjongResources();
        document.getElementById('icon-shuffle').src = mahjongResources.icons.shuffle;
        document.getElementById('icon-hint').src = mahjongResources.icons.hint;
        document.getElementById('icon-undo').src = mahjongResources.icons.undo;
        document.getElementById('icon-settings').src = mahjongResources.icons.settings;

        const myImages = mahjongResources.tiles;

        // =========================================================================
        // Web Audio API Synthesized Mahjong Sound Engine + Poki Ad Mute Compliance
        // =========================================================================
        const SoundFX = {
            ctx: null,
            enabled: true,
            adMuted: false,

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended' && !this.adMuted && !document.hidden) {
                    this.ctx.resume().catch(() => {});
                }
            },

            canPlay() {
                return this.enabled && !this.adMuted && !document.hidden;
            },

            setAdMute(mute) {
                this.adMuted = mute;
                if (!this.ctx) return;
                if (mute) {
                    this.ctx.suspend().catch(() => {});
                } else if (this.enabled && !document.hidden) {
                    this.ctx.resume().catch(() => {});
                }
            },

            playTileClack(pitchShift = 1.0, delay = 0) {
                if (!this.canPlay()) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime + delay;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1100 * pitchShift, now);
                osc.frequency.exponentialRampToValueAtTime(260 * pitchShift, now + 0.045);

                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.05);

                const bufferSize = this.ctx.sampleRate * 0.015;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
                }

                const whiteNoise = this.ctx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 2400 * pitchShift;
                filter.Q.value = 1.5;

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.4, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.015);

                whiteNoise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);
                whiteNoise.start(now);
            },

            playMatch(combo = 1) {
                if (!this.canPlay()) return;
                this.init();
                if (!this.ctx) return;

                this.playTileClack(1.05, 0);
                this.playTileClack(1.22, 0.055);

                const now = this.ctx.currentTime + 0.06;
                const baseFreq = 523.25 * Math.pow(1.059463, Math.min(combo - 1, 12));
                const notes = [baseFreq, baseFreq * 1.25, baseFreq * 1.5];

                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    const startTime = now + (idx * 0.055);
                    osc.frequency.setValueAtTime(freq, startTime);

                    gain.gain.setValueAtTime(0.18, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.38);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.4);
                });
            },

            playBlocked() {
                if (!this.canPlay()) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(55, now + 0.09);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.1);
            },

            playMismatch() {
                if (!this.canPlay()) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                [300, 230].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    const start = now + idx * 0.09;
                    osc.frequency.setValueAtTime(freq, start);
                    gain.gain.setValueAtTime(0.2, start);
                    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.12);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(start);
                    osc.stop(start + 0.13);
                });
            },

            playFlip() {
                if (!this.canPlay()) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.09);
            },

            playShuffle() {
                if (!this.canPlay()) return;
                this.init();
                for (let i = 0; i < 7; i++) {
                    this.playTileClack(0.85 + Math.random() * 0.4, i * 0.04);
                }
            },

            playHint() {
                if (!this.canPlay()) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;

        function resizeBoard() {
            const shell = document.getElementById('app-shell');
            const headerEl = document.getElementById('top-hud');
            const controlsEl = document.getElementById('bottom-controls');
            const wrapper = document.getElementById('board-wrapper');

            const isWideLevel = (currentLevelIndex % levels.length) === 2;
            const boardLayoutW = isWideLevel ? 515 : 465;
            const boardLayoutH = 475;
            
            const totalH = shell.clientHeight || window.innerHeight;
            const headerH = headerEl ? headerEl.offsetHeight : 76;
            const controlsH = controlsEl ? controlsEl.offsetHeight : 76;
            
            let cw = (wrapper.clientWidth || shell.clientWidth || window.innerWidth) - 10;
            let ch = Math.max(160, totalH - headerH - controlsH - 12);
            
            const scaleX = cw / boardLayoutW;
            const scaleY = ch / boardLayoutH;
            
            let scale = Math.min(scaleX, scaleY);
            if (isNaN(scale) || scale < 0.2) scale = 0.75;
            if (scale > 2.25) scale = 2.25;
            
            board.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizeBoard);

            document.getElementById('end-screen').classList.add('hidden');

            board.innerHTML = '';

            document.getElementById('hud-level').innerText = levelIndex + 1;
            const lvlProgress = (((levelIndex % levels.length) + 1) / levels.length) * 100;
            document.getElementById('hud-level-progress').style.width = `${lvlProgress}%`;

            const layout = levels[levelIndex % levels.length];
            const total = layout.length % 2 === 0 ? layout.length : layout.length - 1;
            totalPairs = total / 2;

            const validLayout = layout.slice(0, total);
            let newAssignments = generateSolvableDeck(validLayout);

            let allTilesConf = [];
            validLayout.forEach((pos) => {
                let imgAssigned = newAssignments.get(pos) || myImages[0];
                allTilesConf.push({ pos, img: imgAssigned, imageId: imgAssigned });
            });

            allTilesConf.forEach((conf, idx) => {
                const isMystery = Math.random() < 0.05;
                const el = document.createElement('div');
                
                el.className = `tile dealing ${isMystery ? 'facedown' : ''}`;
                el.style.animationDelay = `${(conf.pos.z * 0.08) + (idx * 0.004)}s`;
                el.style.backgroundImage = `url("${conf.img}")`;
                el.style.width = TILE_VISUAL_W + 'px';
                el.style.height = TILE_VISUAL_H + 'px';
                el.style.left = (conf.pos.x - (conf.pos.z * Z_DEPTH)) + 'px';
                el.style.top = (conf.pos.y - (conf.pos.z * Z_DEPTH)) + 'px';
                el.style.zIndex = conf.pos.z * 100 + Math.floor(conf.pos.y);

                setTimeout(() => el.classList.remove('dealing'), 750);

                const tileObj = { 
                    el, x: conf.pos.x, y: conf.pos.y, z: conf.pos.z, 
                    imageId: conf.imageId, 
                    active: true, 
                    isMystery: isMystery, 
                    isRevealed: false
                };
                el.addEventListener('click', () => handleTileClick(tileObj));
                board.appendChild(el);
                activeTiles.push(tileObj);
            });

            setTimeout(resizeBoard, 10);
            updateUI();

            PokiManager.gameplayStart();
        }

        // =========================================================================
        // Automatic Reshuffle When No Moves Remain
        // =========================================================================
        function autoReshuffle() {
            const activeOnly = activeTiles.filter(t => t.active);
            if (activeOnly.length === 0) return;

            isProcessing = true;
            SoundFX.playShuffle();
            AppState.haptic([20, 40, 20]);

            let images = activeOnly.map(t => t.imageId);
            let foundMatch = false;
            let attempts = 0;

            while (!foundMatch && attempts < 200) {
                images.sort(() => Math.random() - 0.5);
                activeOnly.forEach((t, i) => { t.tempImageId = images[i]; });
                
                const freeNormal = activeOnly.filter(t => t.isFree);
                for(let i = 0; i < freeNormal.length; i++) {
                    for(let j = i + 1; j < freeNormal.length; j++) {
                        if(freeNormal[i].tempImageId === freeNormal[j].tempImageId) {
                            foundMatch = true;
                            break;
                        }
                    }
                    if(foundMatch) break;
                }
                attempts++;
            }

            if (!foundMatch) {
                let activePositions = activeOnly.map(t => ({ x: t.x, y: t.y, z: t.z, tileRef: t }));
                let solvableMap = generateSolvableDeck(activePositions);
                activePositions.forEach(p => {
                    p.tileRef.tempImageId = solvableMap.get(p) || myImages[0];
                });
            }

            activeOnly.forEach((t) => {
                t.imageId = t.tempImageId;
                t.el.style.backgroundImage = `url("${t.imageId}")`;
                t.el.style.transition = 'transform 0.3s ease';
                t.el.style.transform = 'scale(0)';
                setTimeout(() => { 
                    t.el.style.transform = 'scale(1)'; 
                    setTimeout(() => {
                        t.el.style.transition = '';
                        t.el.style.transform = '';
                    }, 300); 
                }, 300);
            });

            if(selectedTile) {
                selectedTile.el.classList.remove('selected');
                if(selectedTile.isMystery) {
                    selectedTile.isRevealed = false;
                    selectedTile.el.classList.add('facedown');
                }
                selectedTile = null;
            }
            
            showToast(i18n[currentLang].autoShuffle);
            setTimeout(() => {
                calculateLogic();
                isProcessing = false;
            }, 650);
        }

        function executeShuffle() {
            if (isProcessing) return;
            SoundFX.playShuffle();
            AppState.haptic([20, 30, 20]);
            activeTiles.forEach(t => t.el.classList.remove('hinted'));
            
            const activeOnly = activeTiles.filter(t => t.active);
            let activePositions = activeOnly.map(t => ({ x: t.x, y: t.y, z: t.z, tileRef: t }));
            
            let newAssignments = generateSolvableDeck(activePositions);

            activePositions.forEach(p => {
                let t = p.tileRef;
                t.imageId = newAssignments.get(p); 
                t.el.style.backgroundImage = `url("${t.imageId}")`; 
                
                if (t.isMystery && !t.isRevealed) {
                    t.el.classList.add('facedown');
                }
            });

            if(selectedTile) { 
                selectedTile.el.classList.remove('selected'); 
                if(selectedTile.isMystery) {
                    selectedTile.isRevealed = false;
                    selectedTile.el.classList.add('facedown');
                }
                selectedTile = null; 
            }
            updateUI();
        }

        function executeHint() {
            if (isProcessing) return;
            activeTiles.forEach(t => t.el.classList.remove('hinted'));
            
            const free = activeTiles.filter(t => t.active && t.isFree);
            for(let i=0; i<free.length; i++) {
                for(let j=i+1; j<free.length; j++) {
                    if(free[i].imageId === free[j].imageId) {
                        SoundFX.playHint();
                        AppState.haptic(20);
                        let t1 = free[i];
                        let t2 = free[j];
                        
                        const applyHint = (t) => {
                            if (t.isMystery && !t.isRevealed) {
                                t.isRevealed = true;
                                flipTileFaceUp(t, () => { t.el.classList.add('hinted'); });
                            } else {
                                t.el.classList.add('hinted');
                            }
                        };

                        applyHint(t1);
                        applyHint(t2);

                        createExplosion(t1.el, true); 
                        createExplosion(t2.el, true);
                        updateUI(); 
                        return true;
                    }
                }
            }
            SoundFX.playBlocked();
            showToast(i18n[currentLang].noMoves);
            return false;
        }

        function createExplosion(element, isHintEffect = false) {
            const centerX = element.offsetLeft + (TILE_VISUAL_W / 2);

            for (let i = 0; i < 16; i++) {

                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.color = particle.style.backgroundColor; 
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 65 + 30; 
                particle.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                particle.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                board.appendChild(particle);
                setTimeout(() => particle.remove(), 600);
            }
        }

        function checkDeadlock() {
            const freeTiles = activeTiles.filter(t => t.active && t.isFree);
            for (let i = 0; i < freeTiles.length; i++) {
                for (let j = i + 1; j < freeTiles.length; j++) {
                    if (freeTiles[i].imageId === freeTiles[j].imageId) return false; 
                }
            }
            return true;
        }

        function calculateLogic() {
            activeTiles.forEach(tile => {
                if(!tile.active) return;
                let topBlocked = false, leftBlocked = false, rightBlocked = false;
                activeTiles.forEach(other => {
                    if(other === tile || !other.active) return;
                    if(other.z > tile.z && checkOverlap(tile, other)) topBlocked = true;
                    if(other.z === tile.z && checkOverlap(tile, other)) {
                        if(other.x < tile.x) leftBlocked = true;
                        if(other.x > tile.x) rightBlocked = true;
                    }
                });
                tile.isFree = !topBlocked && (!leftBlocked || !rightBlocked);
                
                if (tile.isFree) { 
                    tile.el.classList.remove('blocked'); 
                } else { 
                    tile.el.classList.add('blocked'); 
                    tile.el.classList.remove('hinted'); 
                }
            });
        }

        function handleTileClick(tile) {
            if(!tile.active || isProcessing) return;

            if (!tile.isFree) {
                SoundFX.playBlocked();
                AppState.haptic(35);
                tile.el.classList.remove('shake');
                void tile.el.offsetWidth;
                tile.el.classList.add('shake');
                setTimeout(() => tile.el.classList.remove('shake'), 300);
                return;
            }

            tile.el.classList.remove('hinted');

            if(!selectedTile) {
                selectedTile = tile;
                AppState.haptic(10);
                if(tile.isMystery && !tile.isRevealed) {
                    isProcessing = true;
                    tile.isRevealed = true;
                    flipTileFaceUp(tile, () => {
                        tile.el.classList.add('selected');
                        isProcessing = false;
                    });
                } else {
                    SoundFX.playTileClack(1.0);
                    tile.el.classList.add('selected');
                }
            } else {
                if(selectedTile === tile) {
                    SoundFX.playTileClack(0.82);
                    AppState.haptic(8);
                    tile.el.classList.remove('selected');
                    if(tile.isMystery) {
                        isProcessing = true;
                        tile.isRevealed = false;
                        flipTileFaceDown(tile, () => { isProcessing = false; });
                    }
                    selectedTile = null;
                } else {
                    isProcessing = true; 
                    
                    const finalizeMatch = () => {
                        tile.el.classList.add('selected');
                        
                        if(selectedTile.imageId === tile.imageId) {
                            const matched1 = selectedTile;
                            const matched2 = tile;
                            matched1.active = false;
                            matched2.active = false;
                            selectedTile = null;

                            const now = Date.now();
                            if (now - lastMatchTime < 4500) {
                                comboCount++;
                            } else {
                                comboCount = 1;
                            }
                            lastMatchTime = now;

                            const comboBadge = document.getElementById('hud-combo');
                            if (comboCount > 1) {
                                comboBadge.innerText = `🔥 COMBO x${comboCount}`;
                                comboBadge.classList.add('active');
                                clearTimeout(comboTimeout);
                                comboTimeout = setTimeout(() => comboBadge.classList.remove('active'), 4200);
                            } else {
                                comboBadge.classList.remove('active');
                            }

                            const earnedPoints = 100 * comboCount;
                            SoundFX.playMatch(comboCount);
                            AppState.haptic([15, 30, 20]);

                            setTimeout(() => {
                                createExplosion(matched1.el);
                                createExplosion(matched2.el);
                                spawnFloatingScore(matched1.el, matched2.el, earnedPoints, comboCount);

                                matched1.el.style.opacity = '0';
                                matched2.el.style.opacity = '0';
                                matched1.el.classList.remove('selected', 'hinted');
                                matched2.el.classList.remove('selected', 'hinted');

                                setTimeout(() => {
                                    matched1.el.style.visibility = 'hidden';
                                    matched2.el.style.visibility = 'hidden';
                                }, 300);

                                moveHistory.push({t1: matched1, t2: matched2});
                                score += earnedPoints;
                                if (score > AppState.bestScore) {
                                    AppState.bestScore = score;
                                    AppState.save();
                                }

                                const scoreEl = document.getElementById('hud-score');
                                scoreEl.classList.add('score-bump');
                                setTimeout(() => scoreEl.classList.remove('score-bump'), 180);

                                isProcessing = false;
                                updateUI();
                            }, 260); 
                        } else {
                            SoundFX.playMismatch();
                            AppState.haptic(40);
                            comboCount = 0;
                            document.getElementById('hud-combo').classList.remove('active');

                            setTimeout(() => {
                                selectedTile.el.classList.remove('selected');
                                tile.el.classList.remove('selected');
                                
                                let flipCount = 0;
                                let flipsNeeded = (selectedTile.isMystery ? 1 : 0) + (tile.isMystery ? 1 : 0);
                                
                                const onFlipDone = () => {
                                    flipCount++;
                                    if(flipCount === flipsNeeded) {
                                        selectedTile = null;
                                        isProcessing = false;
                                    }
                                };

                                if(flipsNeeded === 0) {
                                    selectedTile = null;
                                    isProcessing = false;
                                } else {
                                    if(selectedTile.isMystery) { selectedTile.isRevealed = false; flipTileFaceDown(selectedTile, onFlipDone); }
                                    if(tile.isMystery) { tile.isRevealed = false; flipTileFaceDown(tile, onFlipDone); }
                                }
                            }, 600); 
                        }
                    };

                    if(tile.isMystery && !tile.isRevealed) {
                        tile.isRevealed = true;
                        flipTileFaceUp(tile, finalizeMatch);
                    } else {
                        finalizeMatch();
                    }
                }
            }
        }

        function showVictoryScreen() {
            PokiManager.gameplayStop();

            SoundFX.playWin();
            AppState.haptic([40, 60, 40, 60, 80]);
            spawnConfetti();

            ['star-1', 'star-2', 'star-3'].forEach(id => document.getElementById(id).classList.remove('show'));

            // Show the +2 Bonus notification when completing every 2nd level (entering Level 3, Level 5, Level 7...)
            const nextLevelIndex = currentLevelIndex + 1;
            const bonusEl = document.getElementById('ui-level-bonus');
            if (nextLevelIndex % 2 === 0) {
                bonusEl.style.display = 'block';
                bonusEl.innerText = i18n[currentLang].lvlBonus;
            } else {
                bonusEl.style.display = 'none';
            }

            setTimeout(() => {
                document.getElementById('end-score').innerText = score;
                document.getElementById('end-screen').classList.remove('hidden');

                ['star-1', 'star-2', 'star-3'].forEach((id, idx) => {
                    setTimeout(() => {
                        document.getElementById(id).classList.add('show');
                        SoundFX.playTileClack(1.1 + idx * 0.15);
                    }, 220 * (idx + 1));
                });
            }, 450);
        }

        function updateUI() {
            document.getElementById('hud-score').innerText = score;
            document.getElementById('hud-best').innerText = AppState.bestScore;
            document.getElementById('badge-undo-count').innerText = moveHistory.length;
            updateHelpBadgesUI();

            const remaining = activeTiles.filter(t => t.active).length;
            const pairsMatched = totalPairs - (remaining / 2);
            document.getElementById('hud-tiles').innerText = pairsMatched;
            document.getElementById('hud-progress').style.width = `${totalPairs > 0 ? (pairsMatched / totalPairs) * 100 : 0}%`;
            calculateLogic();
            
            if(remaining === 0 && activeTiles.length > 0) {
                showVictoryScreen();
            } else if (remaining > 0 && checkDeadlock()) {
                autoReshuffle();
            }
        }

        document.getElementById('btn-start').addEventListener('click', () => startGame(currentLevelIndex));
        
        // Advance to next level: grant +2 Helps every 2 levels (Level 1 -> 2, Level 3 -> 2, Level 5 -> 2...)
        document.getElementById('btn-next-level').addEventListener('click', () => { 
            currentLevelIndex++;
            if (currentLevelIndex % 2 === 0) {
                shuffleHelps += HELPS_AMOUNT;
                hintHelps += HELPS_AMOUNT;
            }
            updateHelpBadgesUI();
            AppState.save();

            PokiManager.commercialBreak(() => {
                startGame(currentLevelIndex);
            });
        });

        // Initialize saved state, English UI, and Poki SDK
        AppState.load();
        setLanguage(currentLang);
        updateHelpBadgesUI();
        document.getElementById('hud-best').innerText = AppState.bestScore;
        PokiManager.init();
    </script>
</body>
</html>
